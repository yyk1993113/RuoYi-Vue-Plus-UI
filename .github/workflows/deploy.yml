name: deploy

# 已合闸：push 到 main 即自动部署运营台到生产（rsync 替换 dist/admin，nginx 实时生效，无重启）。
on:
  workflow_dispatch: {}
  push:
    branches: [main]

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 本仓 .gitignore 忽略 pnpm-lock.yaml，无提交的 lockfile，故不用 frozen/缓存。
      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build (vite build:prod -> dist/)
        run: pnpm build:prod

      - name: Package dist
        run: |
          test -f dist/index.html || { echo "构建产物缺 dist/index.html"; exit 1; }
          tar czf dist.tgz -C dist .
          ls -la dist.tgz

      - name: Upload to OSS, presign & deploy
        env:
          OSS_AK_ID: ${{ secrets.ALIYUN_OSS_AK_ID }}
          OSS_AK_SECRET: ${{ secrets.ALIYUN_OSS_AK_SECRET }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          OSS_BUCKET: yjtnj
          OSS_ENDPOINT: oss-cn-beijing.aliyuncs.com
          COMPONENT: admin
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::8}"
          export OBJ="deploy/${COMPONENT}/${SHA}-${GITHUB_RUN_ID}.tgz"

          echo "::group::上传产物到 OSS 并生成预签名 URL"
          URL="$(OBJ="$OBJ" LOCAL_FILE=dist.tgz python3 .github/ci/oss_put.py)"
          echo "presigned host: $(echo "$URL" | sed -E 's#(https?://[^/]+/).*#\1...#')"
          echo "::endgroup::"

          echo "::group::自检：下载预签名 URL 并验 gzip"
          curl -fsSL -o /tmp/selfcheck.tgz "$URL"
          tar tzf /tmp/selfcheck.tgz >/dev/null && echo "✅ 有效 tar.gz" || { echo "❌ 非gzip"; exit 1; }
          echo "::endgroup::"

          echo "::group::调服务器部署 webhook (component=$COMPONENT, 真部署)"
          BODY="$(printf '{"component":"%s","url":"%s","version":"%s"}' "$COMPONENT" "$URL" "$SHA")"
          SIG="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" | sed 's/^.*= //')"
          RESP="$(curl -sS -X POST https://api.zgypzp.com/_deploy \
            -H "X-Deploy-Signature: $SIG" -H "Content-Type: application/json" \
            --data "$BODY" --max-time 600 -w $'\n%{http_code}')"
          CODE="$(printf '%s' "$RESP" | tail -1)"
          JSON="$(printf '%s' "$RESP" | sed '$d')"
          echo "$JSON" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('log','')); print('--- ok=%s rc=%s ---'%(d.get('ok'),d.get('rc')))" 2>/dev/null || echo "$JSON"
          echo "::endgroup::"
          [ "$CODE" = "200" ] || { echo "❌ 运营台部署失败 HTTP=$CODE"; exit 1; }
          echo "✅ 运营台部署成功 (version=$SHA)"
